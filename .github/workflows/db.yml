name: db

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      MUSAWIQ_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      MUSAWIQ_DATABASE_URL: postgresql+psycopg://musawiq_app:app@localhost:5432/musawiq
      MUSAWIQ_TEST_DATABASE_URL: postgresql+psycopg://musawiq_app:app@localhost:5432/musawiq_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Create application role and databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE musawiq_app LOGIN PASSWORD 'app';" \
            -c "CREATE DATABASE musawiq OWNER musawiq_app;" \
            -c "CREATE DATABASE musawiq_test OWNER musawiq_app;"

      - name: Verify
        run: python -m scripts.verify_all
