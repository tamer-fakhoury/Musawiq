[project]
name = "musawiq"
version = "0.0.0"
description = "Musawiq product-testing platform — database layer"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.9,<1",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "scripts",
    "musawiq",
    "musawiq.api",
    "musawiq.api.routers",
    "musawiq.db",
    "musawiq.repositories",
]
package-dir = { "musawiq" = "src/musawiq", "musawiq.api" = "src/musawiq/api", "musawiq.api.routers" = "src/musawiq/api/routers", "musawiq.db" = "src/musawiq/db", "musawiq.repositories" = "src/musawiq/repositories" }

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra"
