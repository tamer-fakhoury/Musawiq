[project]
name = "musawiq"
version = "0.0.0"
description = "Musawiq product-testing platform — database layer"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
